# Reads pressure and temperature from the Soldered BMP585 breakout board
# once per update_interval.

esphome:
  name: bmp585-basic

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: UART0

external_components:
  - source:
      type: local
      path: ../components
    components: [bmp585]

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

sensor:
  - platform: bmp585
    address: 0x47
    update_interval: 1s
    temperature_oversampling: 1X
    pressure_oversampling: 1X
    odr: 50HZ
    pressure:
      name: "BMP585 Pressure"
    temperature:
      name: "BMP585 Temperature"
